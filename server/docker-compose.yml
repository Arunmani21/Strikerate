version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: strikerate_db
    environment:
      POSTGRES_DB: strikerate_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Arunme211
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strikerate_api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      JWT_SECRET: strikerate_secret_key_change_in_production
      JWT_EXPIRES_IN: 24h
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: strikerate_db
      DB_USER: postgres
      DB_PASSWORD: Arunme211
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run start:prod

volumes:
  postgres_data:
